<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint Party</title>
<link rel="icon" href="data:,">
<style>
  :root { --qr: 30vh; } /* QR size: scans from about 3 m on a TV, 1-1.5 m on a laptop screen */
  body { margin: 0; overflow: hidden; background: #101218; color: #101218; font: 800 2.4vh system-ui, sans-serif; }
  #arena { position: fixed; inset: 0 0 3.2vh; width: 100%; height: calc(100% - 3.2vh); }
  .join { position: fixed; right: 2vh; bottom: 5vh; padding: 1.4vh; border-radius: 1.8vh; background: #fff;
          box-shadow: 0 0.6vh 3vh #0006; text-align: center; }
  .join img { display: block; width: var(--qr); height: var(--qr); }
  .join b { display: block; font-size: 3vh; }
  .join small { display: block; color: #6b7080; font-size: 1.5vh; font-weight: 600; }
  #count { font-size: 4vh; font-variant-numeric: tabular-nums; }
  .join.full img, .join.full b, .join.full small { display: none; }
  .peek { opacity: 0.3; } /* a blob is underneath */
  #clock { position: fixed; top: 1.5vh; left: 50%; transform: translateX(-50%); padding: 0 2.4vh; border-radius: 99px;
           background: #101218b0; color: #fff; font-size: 6vh; font-variant-numeric: tabular-nums; }
  #shares { position: fixed; left: 0; right: 0; bottom: 0; height: 3.2vh; display: flex; }
  #shares i { overflow: hidden; padding-left: 0.8vh; background: var(--c); color: #fff; font-style: normal;
              line-height: 3.2vh; white-space: nowrap; text-shadow: 0 1px 2px #0008; }
  #hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0; font-size: 8vh;
          pointer-events: none; animation: breathe 2s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity: 0.25; } to { opacity: 0.6; } }
</style>
</head>
<body>
<canvas id="arena"></canvas>
<div id="clock"></div>
<p id="hint">Scan to play</p>
<div id="shares"></div>
<div class="join" id="join">
  <img id="qr" alt="QR code to join">
  <b>Scan to join</b>
  <div id="count"></div>
  <small id="room"></small>
</div>

<script type="module">
import { host } from '/joinstick/host.js';

const ROUND = 75, BREAK = 8;                // seconds
const GW = 240, SCALE = 8;                  // paint grid width in cells; canvas px per cell
const SPEED = 32, DASH_SPEED = 110;         // cells per second
const DASH_TIME = 0.18, DASH_COOLDOWN = 1, BOMB_COOLDOWN = 4; // seconds
const BODY = 6, BRUSH = 4, BOMB = 16;       // radius in cells
const COLORS = [['Red', '#e5484d'], ['Blue', '#2f6fed'], ['Green', '#2fa84f'], ['Yellow', '#f5c400'],
                ['Purple', '#8e4ec6'], ['Orange', '#ff8a00'], ['Pink', '#ff5fc8'], ['Cyan', '#00b8d9']];

const room = await host({
  slots: COLORS.length,
  layout: {
    stick: 'dpad',
    arrangement: 'arc',
    buttons: [
      { id: 'dash', label: 'DASH', color: '#f5a524', size: 'large' },
      { id: 'bomb', label: 'BOMB', color: '#e5484d', haptic: 0 }, // the game vibrates when the bomb really goes off
    ],
  },
});
const $ = (id) => document.getElementById(id);
// One QR for everyone: each phone that scans it gets the first free slot.
function showRoom(status = 'connected') {
  $('qr').src = room.qr();
  $('room').textContent = status === 'connected' ? room.joinUrl().replace(/^https?:\/\//, '') : status;
}
room.on('status', showRoom); // after a reconnect the code or join address may differ
showRoom();

// The floor: one byte per cell, 0 = white, n = player n. Painting also writes the
// pixel and keeps a per-player count, so coverage is free every frame.
const ctx = $('arena').getContext('2d');
const paint = document.createElement('canvas');
const counts = new Array(COLORS.length + 1).fill(0);
const RGB = COLORS.map(([, hex]) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)));
let GH, grid, pixels;

// A fresh floor shaped like the window, so the canvas fills the screen.
function newFloor() {
  const { clientWidth: w, clientHeight: h } = ctx.canvas;
  GH = Math.round(Math.min(2 * GW, Math.max(GW / 3, (GW * h) / w)));
  grid = new Uint8Array(GW * GH);
  pixels = new ImageData(GW, GH);
  pixels.data.fill(255);
  counts.fill(0);
  counts[0] = grid.length;
  [paint.width, paint.height] = [GW, GH];
  [ctx.canvas.width, ctx.canvas.height] = [GW * SCALE, GH * SCALE];
}

function stamp(cx, cy, r, n) {
  for (let y = Math.max(0, Math.ceil(cy - r)); y <= Math.min(GH - 1, cy + r); y++) {
    for (let x = Math.max(0, Math.ceil(cx - r)); x <= Math.min(GW - 1, cx + r); x++) {
      const i = y * GW + x;
      if ((x - cx) ** 2 + (y - cy) ** 2 > r * r || grid[i] === n) continue;
      counts[grid[i]]--;
      counts[n]++;
      grid[i] = n;
      pixels.data.set(RGB[n - 1], i * 4);
    }
  }
}

const coverage = (n) => Math.round((counts[n] / grid.length) * 100);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// Players come and go at any moment: each frame, slots with a phone get a blob.
const players = new Map(); // slot -> blob

function spawn(n) {
  players.set(n, {
    x: BODY + Math.random() * (GW - 2 * BODY), y: BODY + Math.random() * (GH - 2 * BODY),
    fx: 1, fy: 0, dash: 0, dashCd: 0, bombCd: 0, bumpCd: 0, boom: 0, off: '',
  });
  const [name, color] = COLORS[n - 1];
  room.pad(n, { title: name, color, disabled: [] }); // the phone shows the player's colour
}

function splat(x, y, r, n) {
  stamp(x, y, r, n);
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * 2 * Math.PI, d = r + 1 + Math.random() * r * 0.45;
    stamp(x + Math.cos(a) * d, y + Math.sin(a) * d, (r / 16) * (1.5 + Math.random() * 3), n);
  }
}

function bomb(n, p) {
  splat(p.x, p.y, BOMB, n);
  p.boom = 0.35;
  room.pad(n, { vibrate: 150 });
}

// Blobs push each other apart; both phones buzz.
function bumps() {
  const list = [...players];
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const [[na, a], [nb, b]] = [list[i], list[j]];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
      if (d >= 2 * BODY) continue;
      const push = (2 * BODY - d) / 2;
      a.x -= (dx / d) * push; a.y -= (dy / d) * push;
      b.x += (dx / d) * push; b.y += (dy / d) * push;
      for (const [n, p] of [[na, a], [nb, b]]) {
        if (p.bumpCd <= 0) room.pad(n, { vibrate: 40 });
        p.bumpCd = 0.5;
      }
    }
  }
}

let phase = 'play', timeLeft = ROUND, breakLeft = 0, results = [], idleSplat = 0;

function newRound() {
  newFloor();
  for (const n of players.keys()) spawn(n);
  phase = 'play';
  timeLeft = ROUND;
}

function update(dt) {
  const wasEmpty = !players.size;
  for (let n = 1; n <= room.slots; n++) {
    if (room.connected(n) && !players.has(n)) spawn(n);
    if (!room.connected(n)) players.delete(n); // their paint stays on the floor
  }
  if (wasEmpty && players.size && phase === 'play') newRound(); // the first player starts a fresh round

  if (!players.size && (idleSplat -= dt) <= 0) { // nobody here: soft splats while the QR waits
    idleSplat = 0.8;
    splat(Math.random() * GW, Math.random() * GH, 4 + Math.random() * 8, 1 + Math.floor(Math.random() * COLORS.length));
  }

  for (const [n, p] of players) {
    const { x, y, pressed } = room.input(n); // poll once per frame; pressed = went down since last frame
    for (const k of ['dash', 'dashCd', 'bombCd', 'bumpCd', 'boom']) p[k] -= dt;
    if (phase !== 'play') continue;
    const len = Math.hypot(x, y); // the d-pad gives 8 directions; diagonals are normalised
    if (len) [p.fx, p.fy] = [x / len, y / len];
    if (pressed.dash && p.dashCd <= 0) [p.dash, p.dashCd] = [DASH_TIME, DASH_COOLDOWN];
    if (pressed.bomb && p.bombCd <= 0) { p.bombCd = BOMB_COOLDOWN; bomb(n, p); }
    const v = p.dash > 0 ? DASH_SPEED : len ? SPEED : 0;
    p.x = clamp(p.x + p.fx * v * dt, BODY, GW - BODY);
    p.y = clamp(p.y + p.fy * v * dt, BODY, GH - BODY);
    stamp(p.x, p.y, BRUSH, n);
    // Grey out buttons while they recharge; only send when that changes.
    const off = [p.dashCd > 0 && 'dash', p.bombCd > 0 && 'bomb'].filter(Boolean);
    if (off.join() !== p.off) {
      p.off = off.join();
      room.pad(n, { disabled: off });
    }
  }
  bumps();

  if (phase === 'play' && players.size && (timeLeft -= dt) <= 0) {
    phase = 'results';
    breakLeft = BREAK;
    results = [...players.keys()].sort((a, b) => counts[b] - counts[a]).map((n) => ({ n, pct: coverage(n) }));
  } else if (phase === 'results' && (breakLeft -= dt) <= 0) newRound();
}

function banner(lines) {
  const { width: w, height: h } = ctx.canvas;
  ctx.fillStyle = '#101218c0';
  ctx.fillRect(0, 0, w, h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.forEach(([text, size, color], i) => {
    ctx.font = `900 ${size}px system-ui, sans-serif`;
    ctx.fillStyle = color;
    ctx.fillText(text, w / 2, h / 2 + (i - (lines.length - 1) / 2) * 150);
  });
}

function render() {
  paint.getContext('2d').putImageData(pixels, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(paint, 0, 0, ctx.canvas.width, ctx.canvas.height);

  for (const [n, p] of players) {
    const [x, y, r, color] = [p.x * SCALE, p.y * SCALE, BODY * SCALE, COLORS[n - 1][1]];
    if (p.boom > 0) { // bomb shockwave
      ctx.beginPath();
      ctx.arc(x, y, BOMB * SCALE * (1 - p.boom / 0.35), 0, 2 * Math.PI);
      ctx.lineWidth = 12;
      ctx.strokeStyle = color;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#101218';
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${r}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n, x, y + 3); // same number as "P1" on the phone
  }

  if (phase === 'results') {
    const [first] = results, [name, color] = COLORS[first.n - 1];
    banner([[`${name} wins!`, 180, color], [`${first.pct}% of the floor`, 72, '#fff'],
            [`Next round in ${Math.ceil(breakLeft)}`, 56, '#c0c4d0']]);
  }
}

// Overlays: join card, clock, and one stacked bar of floor shares below the floor.
// The card and clock fade while a blob is underneath, so nobody gets lost.
function covers(el) {
  const r = el.getBoundingClientRect(), c = ctx.canvas.getBoundingClientRect();
  return [...players.values()].some((p) => {
    const x = c.left + (p.x / GW) * c.width, y = c.top + (p.y / GH) * c.height, pad = (BODY / GW) * c.width;
    return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
  });
}

const shares = COLORS.map(([, color]) => {
  const el = document.createElement('i');
  el.style.setProperty('--c', color);
  $('shares').append(el);
  return el;
});

function overlays() {
  const full = players.size === room.slots;
  $('join').classList.toggle('full', full);
  $('count').textContent = `${players.size}/${room.slots}`;
  $('hint').hidden = players.size > 0;
  $('clock').hidden = !players.size && phase === 'play';
  for (const el of [$('join'), $('clock')]) el.classList.toggle('peek', covers(el));
  const t = Math.ceil(phase === 'play' ? timeLeft : 0);
  $('clock').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  shares.forEach((el, i) => {
    const pct = players.has(i + 1) ? coverage(i + 1) : 0;
    el.hidden = !pct;
    el.style.width = `${pct}%`;
    el.textContent = pct >= 4 ? `${pct}%` : '';
  });
}

newFloor();
addEventListener('resize', () => {
  if (!players.size) newFloor(); // mid-round, the new shape waits for the next round
});
let last = performance.now();
requestAnimationFrame(function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  overlays();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
