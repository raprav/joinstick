name: Release

# Push a tag like v0.2.0 (matching package.json) to publish that version to
# npm. Uses npm trusted publishing (OIDC): no token is stored anywhere, and
# npm adds a provenance attestation by itself.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish (skipped if this version is already on npm)
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "joinstick@$version" version > /dev/null 2>&1; then
            echo "joinstick@$version is already published"
          else
            npm publish --access public
          fi
